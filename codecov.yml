codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
github_checks:
  annotations: true
ignore:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "dist/**"
  - "coverage/**"
  - "*.config.*"
parsers:
  javascript:
    enable_partials: true
  lcov:
    partials_as_hits: false
